name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # Use SSH_KEY (recommended) or SSH_PASSWORD; whichever secret is set is used.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/HelperBot/Yordamchi-bot

            git pull --ff-only

            docker compose down
            docker compose up -d --build

            # Remove dangling images left behind by the rebuild, plus build cache older than a week
            docker image prune -f
            docker builder prune -f --filter "until=168h"

            docker compose ps

services:
  yordamchi:
    build: .
    container_name: yordamchi
    restart: unless-stopped
    # Secrets (ApiId, ApiHash, PhoneNumber, Password) live in .env and override appsettings.json. Copy .env.example -> .env
    env_file: .env
    stdin_open: true        # needed only for the very first login (see below)
    tty: true
    # Match your host user so the session file is writable (Linux: `id -u`, `id -g`).
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      # Edit on the host; channels, routes, texts and delays hot-reload without a restart
      # (ApiId / ApiHash / PhoneNumber / Password in .env need `docker compose up -d` to apply).
      - ./appsettings.json:/app/appsettings.json:ro
      # Userbot login session. A directory (not a single file) is mounted on purpose: if the file
      # does not exist yet, Docker would create a *directory* named WTelegram.session in its place.
      - ./session:/app/session
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

# First run (asks for the code Telegram sends you; creates ./session/WTelegram.session):
#   mkdir session
#   docker compose run --rm -it yordamchi     # Ctrl+C after "Logged in as ..."
# Normal operation afterwards:
#   docker compose up -d --build
